model:
  base_learning_rate: 3.0e-06
  target: ldm.models.diffusion.cfm1_audio.CFM
  params:
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: audio
    cond_stage_key: caption
    mel_dim: 20
    mel_length: 312
    channels: 0
    cond_stage_trainable: False
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_by_std: true
    use_ema: false
    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps:
        - 10000
        cycle_lengths:
        - 10000000000000
        f_start:
        - 1.0e-06
        f_max:
        - 1.0
        f_min:
        - 1.0
    unet_config:
      target: ldm.modules.diffusionmodules.dit.DiT
      params:
        in_channels: 20
        context_dim: 1024
        hidden_size: 768
        num_heads: 32
        depth: 6
        max_len: 1000
        num_experts: 4


    first_stage_config:
      target: ldm.models.autoencoder1d.AutoencoderKL
      params:
        embed_dim: 20
        monitor: val/rec_loss
        ckpt_path: configs/model/vae/  # vae
        ddconfig:
          double_z: true
          in_channels: 80
          out_ch: 80
          z_channels: 20
          kernel_size: 5
          ch: 384
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_layers:
          - 3
          down_layers:
          - 0
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    
    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenFLANEmbedder
      params:
        weights_path: configs/model/  # t5
        max_length: 512

lightning:
  callbacks:
    image_logger:
      target: main.AudioLogger
      params:
        sample_rate: 16000
        for_specs: true
        increase_log_steps: false
        batch_frequency: 5000
        max_images: 8
        melvmin: -5
        melvmax: 1.5
        vocoder_cfg:
          target: vocoder.bigvgan.models.VocoderBigVGAN
          params:
            ckpt_vocoder: configs/model/bigvnat  # vocoder
  trainer:
    benchmark: True
    gradient_clip_val: 1.0
    max_epochs: 100
  modelcheckpoint:
    params:
      monitor: epoch
      mode: max
      save_top_k: 20
      every_n_epochs: 5
      
data:
  target: main.AudioCodecDataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    pad_value: 0.0 
    sampling_rate: 16000
    min_factor: 1 
    min_batch_len: 8000
    spec_crop_len: 163840
    text_column: captions
    audio_column: location
    train_path: your_path_to_train/final_train_with_pitch_energy_newsplit.json
    validation_path: your_path_to_val/final_val_with_pitch_energy_newsplit.json
    train:
      target: ldm.data.joinaudiodataset_speech_anylen.JoinSpecsTrain
      params:
        specs_dataset_cfg:
    validation:
      target: ldm.data.joinaudiodataset_speech_anylen.JoinSpecsValidation
      params:
        specs_dataset_cfg:
        